name: Atualiza vídeos do Caco
on:
  schedule:
    - cron: "17 9,15,22 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  atualiza:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: python3 scripts/atualiza_videos.py
      - run: |
          git config user.name "atualizador"
          git config user.email "atualizador@users.noreply.github.com"
          git add data/videos.json
          git diff --cached --quiet || git commit -m "Vídeos mais recentes"
          git push
