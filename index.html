@keyframes pisca{0%,100%{opacity:.25}50%{opacity:1}}
main{position:relative;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:max(32px,env(safe-area-inset-top)) max(18px,env(safe-area-inset-right)) max(28px,env(safe-area-inset-bottom)) max(18px,env(safe-area-inset-left));gap:6px}
.cald{width:130px;height:130px;margin-bottom:6px}
.cald svg{width:100%;height:100%;overflow:visible}
.bolha{animation:bolha 1.6s infinite ease-in;opacity:0}
@keyframes bolha{0%{transform:translateY(0) scale(.6);opacity:0}20%{opacity:1}100%{transform:translateY(-70px) scale(1.2);opacity:0}}
h1{margin:0;font-family:"HarryP",Cinzel,serif;font-weight:400;font-size:clamp(54px,15vw,84px);line-height:1;letter-spacing:.02em;background:linear-gradient(180deg,#FFF0C2,#E8C46A 55%,#B8892E);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 4px 18px rgba(232,196,106,.35))}
.ola{margin:4px 0 0;font-family:"Cormorant Garamond",serif;font-style:italic;font-size:24px;color:#E6DAFF}
.breve{margin:18px 0 0;font-size:16px;line-height:1.5;color:#CDBDE8;max-width:34ch}
.serie{margin-top:30px;width:min(440px,100%);padding:20px 18px 18px;border-radius:24px;background:linear-gradient(165deg,rgba(46,26,99,.82),rgba(30,16,70,.9));border:1px solid rgba(232,196,106,.32);box-shadow:0 24px 60px rgba(0,0,0,.45)}
.rot{display:inline-flex;align-items:center;gap:8px;font-size:11.5px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:#4FE3C1}
.rot::before{content:"";width:7px;height:7px;border-radius:50%;background:#4FE3C1;box-shadow:0 0 10px #4FE3C1}
.serie h2{margin:10px 0 2px;font-family:"HarryP",Cinzel,serif;font-weight:400;font-size:clamp(34px,9vw,44px);line-height:1.05;color:#F2D58A}
.ep{font-size:14px;color:#CDBDE8}
.relogio{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:16px}
.relogio div{padding:12px 4px 10px;border-radius:16px;background:rgba(13,6,34,.55);border:1px solid rgba(232,196,106,.22)}
.relogio b{display:block;font-family:Cinzel,serif;font-size:clamp(24px,7vw,32px);font-weight:700;color:#FFE9A8;line-height:1.1}
.relogio span{display:block;margin-top:4px;font-size:10.5px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:#9784C4}
footer{margin-top:34px;font-size:12.5px;color:#9784C4}
@media(prefers-reduced-motion:reduce){.ceu i,.bolha{animation:none}.bolha{opacity:.8}}
</style>
</head>
<body>
<div class="ceu" id="ceu" aria-hidden="true"></div>
<main>
  <div class="cald" aria-hidden="true"><svg viewBox="0 0 150 150">
  <circle class="bolha" cx="60" cy="58" r="7" fill="#7CF0C8" style="animation-delay:0s"/><circle class="bolha" cx="84" cy="54" r="5" fill="#8FF3FF" style="animation-delay:.5s"/><circle class="bolha" cx="74" cy="60" r="9" fill="#7CF0C8" style="animation-delay:1s"/><circle class="bolha" cx="94" cy="60" r="4" fill="#B9FFE8" style="animation-delay:.8s"/>
  <ellipse cx="75" cy="66" rx="48" ry="11" fill="#4FE3C1"/><ellipse cx="75" cy="66" rx="48" ry="11" fill="none" stroke="#E8C46A" stroke-width="4"/>
  <path d="M27 68 C27 112 50 132 75 132 C100 132 123 112 123 68" fill="#24124C" stroke="#E8C46A" stroke-width="4"/>
  <path d="M40 132 l-8 12 M110 132 l8 12" stroke="#E8C46A" stroke-width="5" stroke-linecap="round"/>
  <path d="M28 76 c-12 0 -14 14 -2 16 M122 76 c12 0 14 14 2 16" fill="none" stroke="#E8C46A" stroke-width="4"/>
  <circle cx="98" cy="110" r="5" fill="#0D0622" stroke="#E8C46A" stroke-width="2"/>
 </svg></div>
  <h1>Caldeirão App</h1>
  <p class="ola">Fala aí, bruxão!</p>
  <p class="breve">Em breve estaremos online. Enquanto isso, a contagem para a série da HBO já começou.</p>
  <section class="serie" aria-label="Contagem para a série da HBO">
    <span class="rot" id="rot">Série da HBO · Temporada 1</span>
    <h2 id="tit">A Pedra Filosofal</h2>
    <div class="ep" id="ep">Episódio 1</div>
    <div class="relogio" id="relogio"></div>
  </section>
  <footer>App de fã do canal Caldeirão Furado, sem vínculo oficial</footer>
</main>
<script>
(()=>{const c=document.getElementById("ceu");for(let i=0;i<80;i++){const s=document.createElement("i");s.style.left=Math.random()*100+"%";s.style.top=Math.random()*100+"%";s.style.animationDelay=Math.random()*3+"s";c.appendChild(s)}})();
const MES={jan:0,fev:1,mar:2,abr:3,mai:4,jun:5,jul:6,ago:7,set:8,out:9,nov:10,dez:11};
const EPS=[["25 dez 2026","sexta",1],["3 jan 2027","domingo",0],["10 jan 2027","domingo",0],["17 jan 2027","domingo",0],["24 jan 2027","domingo",0],["31 jan 2027","domingo",0],["7 fev 2027","domingo",0],["14 fev 2027","domingo",0]];
const epData=i=>{const [d,m,a]=EPS[i][0].split(" ");return new Date(+a,MES[m],+d,22)};
function relogio(){const ag=new Date();let i=EPS.findIndex((e,k)=>epData(k)>ag);let alvo,tit="A Pedra Filosofal",rot="Série da HBO · Temporada 1",ep;
 if(i>=0){alvo=epData(i);ep=i===0?"Estreia em 25 de dezembro":"Episódio "+(i+1)}else{alvo=new Date(epData(0).getTime()+365*864e5);tit="A Câmara Secreta";rot="Série da HBO · Temporada 2";ep="Data estimada"}
 document.getElementById("tit").textContent=tit;document.getElementById("rot").textContent=rot;document.getElementById("ep").textContent=ep;
 const ms=Math.max(0,alvo-ag);const v=[Math.floor(ms/864e5),Math.floor(ms/36e5)%24,Math.floor(ms/6e4)%60,Math.floor(ms/1e3)%60];
 document.getElementById("relogio").innerHTML=v.map((x,k)=>`<div><b>${String(x).padStart(2,"0")}</b><span>${["dias","horas","min","seg"][k]}</span></div>`).join("")}
relogio();setInterval(relogio,1000);
</script>
</body>
</html>
