<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Caldeirão App</title><meta name="robots" content="noindex">
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(120% 70% at 50% 30%,#3B1C86,#1B0C40 55%,#0D0622);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:#fff}
form{width:min(360px,calc(100% - 36px));padding:24px 20px;border-radius:24px;background:linear-gradient(165deg,#2E1A63,#1E1046);border:1px solid rgba(232,196,106,.35);box-shadow:0 24px 60px rgba(0,0,0,.5);text-align:center}
h1{margin:0 0 6px;font-size:22px;color:#FFE7A3}p{margin:0 0 16px;color:#D9CCF5;font-size:14px;line-height:1.5}
input{width:100%;box-sizing:border-box;height:48px;border-radius:14px;background:#170B33;border:1px solid rgba(232,196,106,.3);padding:0 14px;color:#fff;font-size:16px;margin-bottom:10px}
button{width:100%;height:48px;border:0;border-radius:14px;background:linear-gradient(180deg,#FFE9A8,#E8C46A);color:#2A1460;font-weight:700;font-size:15px;cursor:pointer}
.er{color:#FF9DB8;font-size:13px;min-height:18px;margin-top:8px}label{display:flex;gap:8px;align-items:center;justify-content:center;font-size:13px;color:#D9CCF5;margin-bottom:12px}label input{width:18px;height:18px;margin:0}</style></head>
<body><form id="f"><h1>Caldeirão App</h1><p>Protótipo privado. Digite a senha de acesso.</p><input id="s" type="password" placeholder="Senha" autocomplete="current-password" autofocus><label><input type="checkbox" id="l" checked>Lembrar neste aparelho</label><button>Entrar</button><div class="er" id="e"></div></form>
<script>
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function abre(senha,lembrar){const d=await (await fetch("app.enc?v=1794456609")).json();const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(senha),"PBKDF2",false,["deriveKey"]);
 const k=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b64(d.s),iterations:d.n,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["decrypt"]);
 const html=new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(d.i)},k,b64(d.c)));
 try{if(lembrar)localStorage.setItem("cf-acesso",senha);else sessionStorage.setItem("cf-acesso",senha)}catch(e){}
 document.open();document.write(html);document.close()}
document.getElementById("f").onsubmit=async e=>{e.preventDefault();document.getElementById("e").textContent="";try{await abre(document.getElementById("s").value,document.getElementById("l").checked)}catch(x){document.getElementById("e").textContent="Senha errada."}};
let g=null;try{g=localStorage.getItem("cf-acesso")||sessionStorage.getItem("cf-acesso")}catch(e){}if(g)abre(g,true).catch(()=>{try{localStorage.removeItem("cf-acesso")}catch(e){}});
</script></body></html>
